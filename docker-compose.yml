version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seller-dashboard-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sellertoolkit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without -d, pg_isready defaults to DB name = user ("root"),
      # but our DB is "sellertoolkit".
      test: ["CMD-SHELL", "pg_isready -U root -d sellertoolkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seller-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:


